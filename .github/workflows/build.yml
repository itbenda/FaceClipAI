name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache Core ML model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: Models/FaceNet.mlmodelc
          key: facenet-${{ hashFiles('tools/convert_model.py', 'tools/requirements.txt') }}

      - uses: actions/setup-python@v5
        if: steps.cache-model.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"

      - name: Convert FaceNet to Core ML
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          pip install -r tools/requirements.txt
          mkdir -p Models
          python tools/convert_model.py --out Models/FaceNet.mlpackage
          xcrun coremlcompiler compile Models/FaceNet.mlpackage Models/
          ls -la Models

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project FaceClip.xcodeproj \
            -scheme FaceClip \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FaceClip.app Payload/
          zip -qry FaceClip.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FaceClip-ipa
          path: FaceClip.ipa
          retention-days: 14
