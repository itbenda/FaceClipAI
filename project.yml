name: FaceClip
options:
  bundleIdPrefix: com.personal.faceclip
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FaceClip:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: App
      - path: Models/FaceNet.mlmodelc
        type: folder
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: FaceClip
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: FaceClip đọc video trong thư viện để nhận diện người xuất hiện (xử lý hoàn toàn trên máy).
        NSPhotoLibraryAddUsageDescription: FaceClip tạo album theo từng người.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.faceclip.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
